name: Publish release documentation

# Build the immutable documentation artifact for a published GitHub Release,
# attach it to that release, and dispatch cavi-home to ingest it so the docs
# appear at cavi-ai.xyz/docs/antigravity. The release tag drives the version;
# scripts/docs validate it against package.json, so this workflow is not pinned
# to any single version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version to verify or backfill (defaults to package.json)
        required: false
        type: string
      dry_run:
        description: Build and verify without uploading assets or dispatching cavi-home
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions: {}

concurrency:
  # Serialize on the tag so a manual dispatch and a release event for the same
  # version cannot race the asset upload.
  group: publish-docs-${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.version && format('v{0}', inputs.version)) || 'package' }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Resolve release identity
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          package_version="$(node --input-type=module -e 'import { DOCUMENTED_VERSION } from "./scripts/docs/lib.mjs"; process.stdout.write(DOCUMENTED_VERSION)')"
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
            version="${tag#v}"
          else
            version="${INPUT_VERSION:-$package_version}"
            tag="v${version}"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$tag" != "v${version}" ]]; then
            echo "::error::documentation releases require an exact v-prefixed stable version, got tag '$tag'"
            exit 1
          fi
          if [[ "$version" != "$package_version" ]]; then
            echo "::error::release version $version does not match package.json ($package_version); bump package.json before tagging"
            exit 1
          fi
          commit="$GITHUB_SHA"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$commit" ]]; then
              echo "::error::release tag $tag does not resolve to the checked-out commit"
              exit 1
            fi
          fi
          epoch="$(git show -s --format=%ct "$commit")"
          if [[ ! "$commit" =~ ^[a-f0-9]{40}$ || ! "$epoch" =~ ^[0-9]+$ ]]; then
            echo "::error::release identity does not resolve to immutable provenance"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "epoch=$epoch"
          } >> "$GITHUB_OUTPUT"

      - name: Test package and release documentation
        run: |
          npm test
          npm pack --dry-run
          npm run docs:test

      # Match the other CAVI npm packages: GitHub's OIDC token is exchanged for
      # a short-lived npm publishing credential, so no registry token is stored.
      - name: Publish package
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm install -g npm@11
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v${PKG_VERSION}" ]]; then
            echo "::error::release tag ${RELEASE_TAG} does not match package version ${PKG_VERSION}"
            exit 1
          fi
          if npm view "@cavi-ai/antigravity@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@cavi-ai/antigravity@${PKG_VERSION} is already published; skipping"
          else
            npm publish --access public --provenance
          fi

      - name: Build and verify release artifact
        id: artifact
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          EPOCH: ${{ steps.release.outputs.epoch }}
        run: |
          npm run docs:build -- --version "$VERSION" --tag "$TAG" --commit "$COMMIT" --source-date-epoch "$EPOCH"
          npm run docs:verify -- --version "$VERSION" --tag "$TAG" --commit "$COMMIT" --source-date-epoch "$EPOCH"
          output="$RUNNER_TEMP/antigravity-docs-release"
          envelope="$RUNNER_TEMP/cavi-oss-release.json"
          npm run --silent docs:release -- --docs-root "docs/antigravity/v${VERSION}" --output "$output" --version "$VERSION" --tag "$TAG" --repository "$GITHUB_REPOSITORY" --commit "$COMMIT" --source-date-epoch "$EPOCH" > "$envelope"
          artifact="antigravity-docs-${TAG}.tar.gz"
          sha256="$(jq -r '.artifact.sha256' "$envelope")"
          {
            echo "directory=$output"
            echo "name=$artifact"
            echo "sha256=$sha256"
            echo "envelope=$envelope"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable release assets
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DIRECTORY: ${{ steps.artifact.outputs.directory }}
          ARTIFACT: ${{ steps.artifact.outputs.name }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          release_state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          if ! printf '%s' "$release_state" | jq -e '.isDraft == false and .isPrerelease == false' >/dev/null; then
            echo "::error::documentation asset requires a published, non-prerelease GitHub Release for $TAG"
            exit 1
          fi
          existing="$RUNNER_TEMP/existing-$ARTIFACT"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT" --output "$existing" 2>/dev/null; then
            existing_sha="$(sha256sum "$existing" | cut -d' ' -f1)"
            if [[ "$existing_sha" != "$SHA256" ]]; then
              echo "::error::Existing release asset differs; refusing overwrite"
              exit 1
            fi
            existing_checksum="$RUNNER_TEMP/existing-$ARTIFACT.sha256"
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT.sha256" --output "$existing_checksum" 2>/dev/null; then
              cmp --silent "$existing_checksum" "$DIRECTORY/$ARTIFACT.sha256" || {
                echo "::error::Existing release checksum differs; refusing overwrite"
                exit 1
              }
            else
              gh release upload "$TAG" "$DIRECTORY/$ARTIFACT.sha256" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release upload "$TAG" "$DIRECTORY/$ARTIFACT" "$DIRECTORY/$ARTIFACT.sha256" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Dispatch verified release to cavi-home
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          ENVELOPE: ${{ steps.artifact.outputs.envelope }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::CONSUMER_DISPATCH_TOKEN is required"
            exit 1
          fi
          jq -n --argjson payload "$(cat "$ENVELOPE")" \
            '{event_type:"cavi-oss-release",client_payload:$payload}' | \
            gh api --method POST /repos/cavi-ai/cavi-home/dispatches --input -
